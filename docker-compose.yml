# Full Spendly stack on one machine: Postgres, migrations, API, web.
#   cp .env.example .env    # then fill in secrets
#   docker compose up --build
#   open http://localhost:8080
#
# Builds from the sibling repos ../spendly-api and ../spendly-web.

name: spendly

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spendly}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spendly} -d ${POSTGRES_DB:-spendly}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending Prisma migrations, then exits. The API waits for it.
  migrate:
    image: spendly-api:${IMAGE_TAG:-local}
    build: ../spendly-api
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: &database_url postgresql://${POSTGRES_USER:-spendly}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spendly}?schema=public
      CHECKPOINT_DISABLE: '1'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: spendly-api:${IMAGE_TAG:-local}
    build: ../spendly-api
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database_url
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080
      # Plain HTTP locally; the cookie is Secure in every HTTPS environment.
      COOKIE_SECURE: 'false'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - '4000:4000' # direct API access, e.g. for `stripe listen --forward-to`
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: spendly-web:${IMAGE_TAG:-local}
    build: ../spendly-web
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
