# In-cluster Postgres for local clusters only. Production uses a managed
# database (RDS, Cloud SQL, …) — see overlays/prod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spendly-db
  labels:
    app.kubernetes.io/name: spendly-db
    app.kubernetes.io/component: database
spec:
  serviceName: spendly-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spendly-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendly-db
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: spendly-db-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: spendly-db-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: spendly
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d spendly']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d spendly']
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spendly-db
  labels:
    app.kubernetes.io/name: spendly-db
spec:
  selector:
    app.kubernetes.io/name: spendly-db
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
