# Local cluster (Docker Desktop Kubernetes, kind, minikube).
#   cp secrets.example.env secrets.env && cp db-secrets.example.env db-secrets.env   # fill in
#   kubectl apply -k k8s/overlays/local
#   open http://spendly.localhost
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spendly

resources:
  - ../../base
  - postgres.yaml

images:
  - name: spendly-api
    newName: spendly-api
    newTag: local
  - name: spendly-web
    newName: spendly-web
    newTag: local

secretGenerator:
  - name: spendly-api-secrets
    envs: [secrets.env]
  - name: spendly-db-secrets
    envs: [db-secrets.env]

patches:
  # One replica each is plenty on a laptop.
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: spendly-api-config }
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: http://spendly.localhost
      - op: replace
        path: /data/COOKIE_SECURE
        value: 'false'
      # Sandbox keys locally; Plaid cannot reach a local cluster, so no webhooks
      # (use "Sync now") and no OAuth redirect (sandbox banks don't need it).
      - op: replace
        path: /data/PLAID_ENV
        value: sandbox
      - op: remove
        path: /data/PLAID_WEBHOOK_URL
      - op: remove
        path: /data/PLAID_REDIRECT_URI
  - target: { kind: Ingress, name: spendly }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: spendly.localhost
