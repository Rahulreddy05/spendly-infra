# Non-secret API configuration. Secrets live in the `spendly-api-secrets` Secret
# (created by each overlay), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendly-api-config
data:
  NODE_ENV: production
  PORT: '4000'
  HOST: 0.0.0.0
  LOG_LEVEL: info
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL_DAYS: '30'
  CORS_ORIGINS: https://spendly.example.com
  COOKIE_SECURE: 'true'
  EMAIL_FROM: Spendly <no-reply@spendly.example.com>
  BREACHED_PASSWORD_CHECK: 'true'
  # Raise when shipping an API change older mobile apps cannot handle.
  MIN_IOS_APP_VERSION: 1.0.0
  MIN_ANDROID_APP_VERSION: 1.0.0
  # Plaid bank linking. Keys (PLAID_CLIENT_ID, PLAID_SECRET) are in the Secret.
  PLAID_ENV: production
  # Plaid posts transaction updates here (must be public HTTPS).
  PLAID_WEBHOOK_URL: https://spendly.example.com/api/v1/webhooks/plaid
  # Web OAuth return page and Android app id; both registered in the Plaid Dashboard.
  PLAID_REDIRECT_URI: https://spendly.example.com/oauth-return
  PLAID_ANDROID_PACKAGE_NAME: com.rahulreddy05.spendly
