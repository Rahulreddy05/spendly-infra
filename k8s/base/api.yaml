apiVersion: v1
kind: ServiceAccount
metadata:
  name: spendly-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendly-api
  labels:
    app.kubernetes.io/name: spendly-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: spendly-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendly-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: spendly-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: spendly-api
      initContainers:
        # Applies pending migrations before this version serves traffic. Prisma
        # takes an advisory lock, so pods starting together cannot race.
        - name: migrate
          image: spendly-api
          command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: spendly-api-secrets, key: DATABASE_URL }
            - name: CHECKPOINT_DISABLE
              value: '1'
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: spendly-api
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: spendly-api-config }
            - secretRef: { name: spendly-api-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: '1', memory: 384Mi }
          securityContext: *restricted
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Includes a DB round-trip: a pod that cannot reach Postgres stops getting traffic.
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Give load balancers time to drop this pod before it stops accepting.
            preStop:
              exec:
                command: ['sleep', '5']
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: spendly-api
  labels:
    app.kubernetes.io/name: spendly-api
spec:
  selector:
    app.kubernetes.io/name: spendly-api
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spendly-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: spendly-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # avoid flapping after a burst
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spendly-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spendly-api
